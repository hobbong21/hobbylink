<!--
  subject: HobbyLink 비밀번호 재설정
  preheader: 본인이 요청한 게 아니라면 무시하세요
  Variables: {{reset_url}} (expires in 1 hour)
-->
<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>비밀번호 재설정</title>
</head>
<body style="margin:0;padding:0;background:#F1F5F9;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#0F172A;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0">
    <tr><td align="center">
      <table role="presentation" width="600" cellspacing="0" cellpadding="0" border="0" style="max-width:600px;width:100%;">
        <tr><td style="padding:32px 24px 16px"><span style="font-size:22px;font-weight:700;letter-spacing:-0.02em;">HobbyLink</span></td></tr>
        <tr><td style="background:#FFFFFF;border:1px solid #E2E8F0;border-radius:14px;padding:36px 32px;">
          <h1 style="margin:0 0 10px;font-size:22px;font-weight:600;letter-spacing:-0.02em;line-height:1.3;">
            비밀번호 재설정 요청
          </h1>
          <p style="margin:0 0 20px;font-size:15px;line-height:1.6;color:#334155;">
            아래 버튼을 클릭하면 새 비밀번호를 설정할 수 있습니다. 이 링크는
            <strong>1시간 동안</strong>만 유효합니다.
          </p>
          <table role="presentation" cellspacing="0" cellpadding="0" border="0">
            <tr><td style="background:#2B4CFF;border-radius:8px;">
              <a href="{{reset_url}}" style="display:inline-block;padding:12px 20px;color:#FFFFFF;font-weight:600;font-size:14px;text-decoration:none;">
                비밀번호 재설정하기
              </a>
            </td></tr>
          </table>
          <p style="margin:22px 0 0;font-size:13px;color:#64748B;line-height:1.6;">
            버튼이 작동하지 않으면 아래 링크를 복사해 브라우저에 붙여넣으세요:<br />
            <span style="word-break:break-all;color:#334155;">{{reset_url}}</span>
          </p>
          <div style="margin:24px 0;border-top:1px solid #E2E8F0;"></div>
          <p style="margin:0;font-size:13px;color:#64748B;line-height:1.6;">
            본인이 요청하지 않았다면 이 메일을 무시해도 됩니다. 계정은 안전합니다.
            반복적으로 이런 메일을 받는다면 <a href="{{site_url}}/help" style="color:#2B4CFF;">고객센터</a>에 연락해주세요.
          </p>
        </td></tr>
        <tr><td style="padding:24px;font-size:12px;color:#64748B;line-height:1.6;">
          <p style="margin:0;">&copy; {{year}} HobbyLink.</p>
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
